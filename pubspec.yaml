name: fresh_list
description: "Flutter application to manage your grocery list."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 2.0.2+5

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.50.0"

workspace:
  - packages/expressive_loading_indicator
  - packages/expressive_refresh_indicator
  - packages/expressive_shapes
  - packages/expressive_sheet
  - packages/expressive_snack
  - packages/material_wavy_progress_indicator

dependencies:
  clock: ^1.1.3
  cupertino_icons: ^2.0.0
  cupertino_ui: ^1.1.6
  device_info_plus: ^13.3.0
  drift: ^2.35.4
  drift_dev: ^2.35.3
  expressive_loading_indicator:
    path: packages/expressive_loading_indicator
  expressive_shapes:
    path: packages/expressive_shapes
  expressive_sheet:
    path: packages/expressive_sheet
  expressive_snack:
    path: packages/expressive_snack
  fast_immutable_collections: ^12.0.0
  flutter:
    sdk: flutter
  flutter_email_sender: ^11.2.0
  flutter_gen: ^5.15.0
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^3.5.0
  flutter_svg: ^2.4.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  google_fonts: ^9.0.0
  haptic_feedback: ^0.8.0
  intl: ^0.20.3
  lottie: ^3.8.2
  material_ui: ^1.11.0
  motor: ^1.1.0
  native_nearby_connections:
    git:
      url: https://github.com/TesteurManiak/native_nearby_connections/
      ref: 30e8fab1be7591e613fdd9afc80ebb37ed9f6f0a
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  build_runner: ^2.16.1
  build_version: ^2.1.3
  flutter_driver:
    sdk: flutter
  flutter_gen_runner: ^5.15.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  go_router_builder: ^4.5.3
  vector_graphics_compiler: ^1.3.4
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - google_fonts/
    - assets/icons/svg/precompiled/
    - assets/lottie/

flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true
    lottie: true
  assets:
    enabled: true
    outputs:
      style: camel-case
      class_name: AppAssets

flutter_native_splash:
  color: "#1B2E1E"
  image: "assets/icons/png/ic_launcher_foreground.png"
  color_dark: "#121F14"
  image_dark: "assets/icons/png/ic_launcher_foreground.png"

  android_12:
    color: "#1B2E1E"
    image: "assets/icons/png/ic_launcher_foreground.png"
    icon_background_color: "#1B2E1E"
    color_dark: "#121F14"
    image_dark: "assets/icons/png/ic_launcher_foreground.png"
    icon_background_color_dark: "#121F14"

flutter_launcher_icons:
  # Shared fallback icon
  image_path: "assets/icons/png/icon_preview.png"

  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#1B2E1E"
  adaptive_icon_foreground: "assets/icons/png/ic_launcher_foreground.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/icons/png/ic_launcher_monochrome.png"

  ios: true
  image_path_ios: "assets/icons/png/icon_preview.png"
  remove_alpha_ios: true
  background_color_ios: "#1B2E1E"
  image_path_ios_dark_transparent: "assets/icons/png/ic_launcher_foreground.png"
  image_path_ios_tinted_grayscale: "assets/icons/png/ios_tinted.png"
