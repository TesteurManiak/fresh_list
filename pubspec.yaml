name: todo_list
description: "Flutter application to manage your grocery list."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 2.0.0+3

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  clock: ^1.1.2
  drift: ^2.28.1
  fast_immutable_collections: ^11.0.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^3.1.0
  go_router: ^16.1.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.3
  riverpod_annotation: ^2.6.1
  share_plus: ^11.1.0
  shared_preferences: ^2.2.3
  sqlite3_flutter_libs: ^0.5.39

dev_dependencies:
  build_runner: ^2.4.9
  drift_dev: ^2.28.0
  fd_lints: ^2.5.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: ^3.0.6
  go_router_builder: ^3.0.1
  riverpod_generator: ^2.6.5

flutter:
  uses-material-design: true
  generate: true
