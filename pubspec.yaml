name: todo_list
description: "Flutter application to manage your grocery list."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 2.0.0+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  clock: ^1.1.1
  dart_mappable: ^4.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^12.1.3
  intl: ^0.18.1
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.1
  riverpod_annotation: ^2.3.3
  share_plus: ^7.2.1
  shared_preferences: ^2.2.2
  theme_tailor_annotation: ^2.0.2

dev_dependencies:
  build_runner: ^2.4.7
  dart_mappable_builder: ^4.1.0
  fd_lints: ^2.2.0
  flutter_gen: ^5.3.2
  flutter_gen_runner: ^5.3.2
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  go_router_builder: ^2.4.0
  isar_generator: ^3.1.0+1
  riverpod_generator: ^2.3.3
  riverpod_lint: ^2.1.1
  theme_tailor: ^2.0.2

flutter:
  uses-material-design: true
  generate: true
