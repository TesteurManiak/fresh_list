name: todo_list
description: "Flutter application to manage your grocery list."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 2.0.0+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  clock: ^1.1.1
  drift: ^2.17.0
  fast_immutable_collections: ^10.2.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  freezed_annotation: ^2.4.1
  go_router: ^14.0.2
  intl: ^0.18.1
  path: ^1.9.0
  path_provider: ^2.1.3
  riverpod_annotation: ^2.3.5
  share_plus: ^9.0.0
  shared_preferences: ^2.2.3
  sqlite3_flutter_libs: ^0.5.21
  theme_tailor_annotation: ^3.0.1

dev_dependencies:
  build_runner: ^2.4.9
  drift_dev: ^2.17.0
  fd_lints:
    git:
      url: https://github.com/Floating-Dartists/fd_lints.git
      ref: 185cca3e1f6ef67ba594f93fdd873bb78d26214c
  flutter_gen: ^5.4.0
  flutter_gen_runner: ^5.4.0
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  freezed: ^2.5.2
  go_router_builder: ^2.6.1
  riverpod_generator: ^2.4.0
  riverpod_lint: ^2.3.10
  theme_tailor: ^3.0.1

flutter:
  uses-material-design: true
  generate: true
