name: todo_list
description: "Flutter application to manage your grocery list."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 2.0.0+3

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  clock: ^1.1.3
  cupertino_ui: ^1.0.2
  drift: ^2.35.0
  fast_immutable_collections: ^11.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  intl: ^0.20.2
  material_ui: ^1.2.0
  path: ^1.9.1
  path_provider: ^2.1.3
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  go_router_builder: ^4.5.0
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
