name: todo_list
description: "Flutter application to manage your grocery list."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 2.0.0+3

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

workspace:
  - packages/expressive_loading_indicator
  - packages/expressive_refresh_indicator
  - packages/expressive_shapes
  - packages/expressive_sheet
  - packages/expressive_snack
  - packages/material_wavy_progress_indicator

dependencies:
  clock: ^1.1.3
  cupertino_ui: ^1.1.6
  drift: ^2.35.4
  drift_dev: ^2.35.3
  expressive_loading_indicator:
    path: packages/expressive_loading_indicator
  expressive_shapes:
    path: packages/expressive_shapes
  expressive_sheet:
    path: packages/expressive_sheet
  fast_immutable_collections: ^12.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^3.5.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  google_fonts: ^9.0.0
  haptic_feedback: ^0.8.0
  intl: ^0.20.3
  material_color_utilities: ^0.13.0
  material_ui: ^1.11.0
  material_wavy_progress_indicator:
    path: packages/material_wavy_progress_indicator
  motor: ^1.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sqlite3_flutter_libs: ^0.6.0+eol
  vector_math: ^2.4.4

dev_dependencies:
  build_runner: ^2.16.1
  build_version: ^2.1.3
  flutter_driver:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  go_router_builder: ^4.5.3
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - google_fonts/

flutter_native_splash:
  color: "#FFF9EB"
  color_dark: "#15130C"
  # image: assets/splash/splash-light.png
  # image_dark: assets/splash/splash-dark.png
  android_12:
    color: "#FFF9EB"
    color_dark: "#15130C"
    icon_background_color: "#FFF9EB"
    icon_background_color_dark: "#15130C"
    # image: assets/splash/android-12-light.png
    # image_dark: assets/splash/android-12-dark.png
