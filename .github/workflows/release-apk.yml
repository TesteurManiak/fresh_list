name: Build & Release Signed APK

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    build-android:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: "17"

            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: "stable"
                  cache: true

            - name: Install dependencies
              run: flutter pub get

            - name: Decode keystore and create key.properties
              env:
                  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
              run: |
                  echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
                  cat <<EOF > android/key.properties
                  storePassword=$KEYSTORE_PASSWORD
                  keyPassword=$KEY_PASSWORD
                  keyAlias=$KEY_ALIAS
                  storeFile=upload-keystore.jks
                  EOF

            - name: Build signed release APK
              run: flutter build apk --release

            - name: Clean up signing files
              if: always()
              run: rm -f android/app/upload-keystore.jks android/key.properties

            - name: Create GitHub Release & Upload APK
              uses: softprops/action-gh-release@v2
              with:
                  files: build/app/outputs/flutter-apk/app-release.apk
                  generate_release_notes: true
